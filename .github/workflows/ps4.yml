name: PS4 GoldHEN Experimental PKG
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, ps4-optin-telemetry-recovery]

permissions:
  contents: write

jobs:
  tests:
    name: Test addon, TorBox, settings, GitHub schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute portable C++ regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp tests/core_test.cpp -o /tmp/playtorrio-ps4-tests
          /tmp/playtorrio-ps4-tests
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp src/config_loader.cpp tests/config_loader_test.cpp -o /tmp/playtorrio-settings-loader-tests
          /tmp/playtorrio-settings-loader-tests
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp tests/telemetry_test.cpp -o /tmp/playtorrio-ps4-telemetry-tests
          /tmp/playtorrio-ps4-telemetry-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/audio_pcm_test.cpp -o /tmp/playtorrio-ps4-audio-tests
          /tmp/playtorrio-ps4-audio-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/range_window_test.cpp -o /tmp/ptv-linear-range-tests
          /tmp/ptv-linear-range-tests
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only ps4/telemetry.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only ps4/range_stream.cpp
          g++ -std=c++17 -Wall -Wextra -Werror src/catalog.cpp tests/catalog_test.cpp -o /tmp/playtorrio-ps4-catalog-tests
          /tmp/playtorrio-ps4-catalog-tests
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp tests/playback_choice_test.cpp -o /tmp/playtorrio-playback-choice-tests
          /tmp/playtorrio-playback-choice-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/nv12_scaler_test.cpp -o /tmp/ptv-nv12-quality-tests
          /tmp/ptv-nv12-quality-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/show_details_test.cpp -o /tmp/ptv-show-details-tests
          /tmp/ptv-show-details-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/advanced_discover_test.cpp -o /tmp/ptv-advanced-tests
          /tmp/ptv-advanced-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/local_library_test.cpp -o /tmp/ptv-local-list-tests
          /tmp/ptv-local-list-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/source_badges_test.cpp -o /tmp/ptv-source-badges-tests
          /tmp/ptv-source-badges-tests

  pkg:
    name: Build genuine PS4 experimental package
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Install checksum-verified OpenOrbis v0.5.4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis/sdk.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis/sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis/sdk.tar.gz" -C "$RUNNER_TEMP/openorbis"
          sdk="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -printf '%h\n' | head -1)"
          test -n "$sdk"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Provide legacy OpenSSL only for the official package builder
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb' \
            -o "$RUNNER_TEMP/libssl1.1.deb"
          mkdir -p "$RUNNER_TEMP/pkgtool-libssl"
          dpkg-deb -x "$RUNNER_TEMP/libssl1.1.deb" "$RUNNER_TEMP/pkgtool-libssl"
          test -f "$RUNNER_TEMP/pkgtool-libssl/usr/lib/x86_64-linux-gnu/libssl.so.1.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pkgtool-libssl/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Cross-compile and package
        env:
          PTV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/build-ps4.sh
      - name: Validate PS4 PKG signature
        run: |
          file=dist/PlayTorrio-PS4-GoldHEN-10.01-EXPERIMENTAL.pkg
          test -s "$file"
          test "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" = 7f434e54
          sha256sum "$file"
      - name: Validate emulator-ready extracted app
        run: |
          python3 - <<'PY'
          import zipfile
          path="dist/PlayTorrio-PS4-shadPS4-extracted.zip"
          with zipfile.ZipFile(path) as z:
              expected={"BREW20346/eboot.bin","BREW20346/sce_sys/param.sfo","BREW20346/assets/fonts/Gontserrat-Regular.ttf"}
              assert expected.issubset(set(z.namelist())), sorted(expected-set(z.namelist()))
              assert {"HostTools/Load-Shows.cmd","HostTools/Refresh-Catalog.ps1"}.issubset(set(z.namelist()))
              assert all(z.getinfo(p).file_size>0 for p in expected)
          print("Extracted shadPS4 app folder verified")
          PY
      - name: Preserve PKG and shadPS4 folder artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-PS4-PKG-and-shadPS4-UNPACKED
          path: |
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error
      - name: Publish clearly labeled prototype release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=ps4-advanced-discover-1.5.0
          if gh release view "$release" >/dev/null 2>&1; then
            gh release upload "$release" dist/*.pkg dist/*.zip --clobber
          else
            gh release create "$release" dist/*.pkg dist/*.zip --prerelease \
              --title "PlayTorrio PS4 v1.5.0 — advanced Discover, recommendations and offline My List" \
              --notes "Advanced Discover follows the active Windows/iOS PlayTorrio v1.1.7 branch: optional title search, TMDB sort, origin country, language, year range and page navigation. Adds TMDB recommendations and local-only My List. Native PS4 runtime, image and playback tests still required. GitHub watchlist sync disabled."
          fi
      - name: Send emulator ZIP and experimental PKG to Telegram if configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: "-1003938575195"
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/ps4-advanced-discover-1.5.0
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::notice::Telegram delivery skipped: TELEGRAM_BOT_TOKEN is not configured. Both files are available in the GitHub release."
            echo "Telegram delivery skipped (missing bot token). ZIP and PKG: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pkg="dist/PlayTorrio-PS4-GoldHEN-10.01-EXPERIMENTAL.pkg"
          zip="dist/PlayTorrio-PS4-shadPS4-extracted.zip"
          for file in "$zip" "$pkg"; do
            test -s "$file"
            label="PS4 experimental package"
            if [ "$file" = "$zip" ]; then
              label="shadPS4 emulator ZIP with HostTools/Load-Shows.cmd"
            fi
            if [ "$(stat -c%s "$file")" -ge 50000000 ]; then
              curl --fail --silent --show-error --retry 2 \
                -F "chat_id=$CHANNEL_ID" \
                -F "text=PlayTorrio PS4 v1.5.0 $label: $RELEASE_URL (attachment exceeds 50 MB)" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" >/dev/null
            else
              curl --fail --silent --show-error --retry 2 \
                -F "chat_id=$CHANNEL_ID" \
                -F "document=@$file" \
                -F "caption=PlayTorrio PS4 v1.5.0: $label. Native PS4 TMDB fetch enabled; Windows HostTools is an optional fallback. GitHub sync remains disabled. $RELEASE_URL" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" >/dev/null
            fi
            echo "Delivered $label to configured Telegram channel."
          done
          echo "Telegram delivery completed for ZIP and PKG." >> "$GITHUB_STEP_SUMMARY"

  telegram-pr-build:
    name: Notify Telegram of PS4 build result and download link
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [tests, pkg]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TEST_RESULT: ${{ needs.tests.result }}
      PACKAGE_RESULT: ${{ needs.pkg.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Send Telegram link to the exact PS4 PR build
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ.get('BOT_TOKEN', '').strip()
          chat = os.environ.get('TELEGRAM_CHANNEL_ID', '').strip() or '-1003938575195'
          if not token:
              sys.exit('TELEGRAM_BOT_TOKEN missing in PS4 Actions secrets; cannot send build link.')
          url = os.environ['RUN_URL']
          tests = os.environ['TEST_RESULT']
          package = os.environ['PACKAGE_RESULT']
          commit = os.environ['COMMIT_SHA'][:12]
          status = 'SUCCESS' if tests == 'success' and package == 'success' else 'CHECK BUILD'
          message = (
              f'PlayTorrio PS4 PR #2 telemetry build: {status}\n'
              f'Source: {commit}\n'
              f'Portable tests: {tests}; OpenOrbis package: {package}\n'
              f'PKG and shadPS4 ZIP: {url}#artifacts\n'
              f'Workflow details: {url}\n'
              'Stable v1.5.0 release was not overwritten.'
          )
          payload = urllib.parse.urlencode({
              'chat_id': chat, 'text': message,
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          try:
              request = urllib.request.Request(
                  'https://api.telegram.org/bot' + token + '/sendMessage',
                  data=payload, method='POST')
              with urllib.request.urlopen(request, timeout=25) as response:
                  reply = json.load(response)
              if not reply.get('ok'):
                  sys.exit('Telegram rejected PS4 build link; verify bot/chat permissions.')
              print('Telegram PS4 build link delivered, message ID:',
                    reply['result']['message_id'])
          except Exception as exc:
              # Never show the token-bearing API URL in diagnostics.
              sys.exit('Telegram delivery failed (' + type(exc).__name__ + ').')
          PY
