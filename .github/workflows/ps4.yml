name: PS4 GoldHEN Experimental PKG
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Test addon, TorBox, settings, GitHub schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute portable C++ regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp tests/core_test.cpp -o /tmp/playtorrio-ps4-tests
          /tmp/playtorrio-ps4-tests
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp src/config_loader.cpp tests/config_loader_test.cpp -o /tmp/playtorrio-settings-loader-tests
          /tmp/playtorrio-settings-loader-tests
          g++ -std=c++17 -Wall -Wextra -Werror src/catalog.cpp tests/catalog_test.cpp -o /tmp/playtorrio-ps4-catalog-tests
          /tmp/playtorrio-ps4-catalog-tests
          g++ -std=c++17 -Wall -Wextra -Werror src/core.cpp tests/playback_choice_test.cpp -o /tmp/playtorrio-playback-choice-tests
          /tmp/playtorrio-playback-choice-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/nv12_scaler_test.cpp -o /tmp/ptv-nv12-quality-tests
          /tmp/ptv-nv12-quality-tests
          g++ -std=c++17 -Wall -Wextra -Werror tests/show_details_test.cpp -o /tmp/ptv-show-details-tests
          /tmp/ptv-show-details-tests

  pkg:
    name: Build genuine PS4 experimental package
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Install checksum-verified OpenOrbis v0.5.4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis/sdk.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis/sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis/sdk.tar.gz" -C "$RUNNER_TEMP/openorbis"
          sdk="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -printf '%h\n' | head -1)"
          test -n "$sdk"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Provide legacy OpenSSL only for the official package builder
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb' \
            -o "$RUNNER_TEMP/libssl1.1.deb"
          mkdir -p "$RUNNER_TEMP/pkgtool-libssl"
          dpkg-deb -x "$RUNNER_TEMP/libssl1.1.deb" "$RUNNER_TEMP/pkgtool-libssl"
          test -f "$RUNNER_TEMP/pkgtool-libssl/usr/lib/x86_64-linux-gnu/libssl.so.1.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pkgtool-libssl/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Cross-compile and package
        run: bash scripts/build-ps4.sh
      - name: Validate PS4 PKG signature
        run: |
          file=dist/PlayTorrio-PS4-GoldHEN-10.01-EXPERIMENTAL.pkg
          test -s "$file"
          test "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" = 7f434e54
          sha256sum "$file"
      - name: Validate emulator-ready extracted app
        run: |
          python3 - <<'PY'
          import zipfile
          path="dist/PlayTorrio-PS4-shadPS4-extracted.zip"
          with zipfile.ZipFile(path) as z:
              expected={"BREW20346/eboot.bin","BREW20346/sce_sys/param.sfo","BREW20346/assets/fonts/Gontserrat-Regular.ttf"}
              assert expected.issubset(set(z.namelist())), sorted(expected-set(z.namelist()))
              assert {"HostTools/Load-Shows.cmd","HostTools/Refresh-Catalog.ps1"}.issubset(set(z.namelist()))
              assert all(z.getinfo(p).file_size>0 for p in expected)
          print("Extracted shadPS4 app folder verified")
          PY
      - name: Preserve PKG and shadPS4 folder artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-PS4-PKG-and-shadPS4-UNPACKED
          path: |
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error
      - name: Publish clearly labeled prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=ps4-cinematic-ui-1.4.0
          if gh release view "$release" >/dev/null 2>&1; then
            gh release upload "$release" dist/*.pkg dist/*.zip --clobber
          else
            gh release create "$release" dist/*.pkg dist/*.zip --prerelease \
              --title "PlayTorrio PS4 v1.4.0 — TMDB posters, episodes and manual stream selection" \
              --notes "Runtime v1.3.3 confirmed 97 decoded video frames but only logo flashes and a second HTTP 429. The v1.4.0 build caches video frames, blits directly to native VideoOut memory, increases bounded HTTP ranges to 2 MiB, and tolerates AudioOut already initialized. Smooth video and sound remain unverified. GitHub sync disabled."
          fi
      - name: Send emulator ZIP and experimental PKG to Telegram if configured
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: "-1003938575195"
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/ps4-cinematic-ui-1.4.0
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::notice::Telegram delivery skipped: TELEGRAM_BOT_TOKEN is not configured. Both files are available in the GitHub release."
            echo "Telegram delivery skipped (missing bot token). ZIP and PKG: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pkg="dist/PlayTorrio-PS4-GoldHEN-10.01-EXPERIMENTAL.pkg"
          zip="dist/PlayTorrio-PS4-shadPS4-extracted.zip"
          for file in "$zip" "$pkg"; do
            test -s "$file"
            label="PS4 experimental package"
            if [ "$file" = "$zip" ]; then
              label="shadPS4 emulator ZIP with HostTools/Load-Shows.cmd"
            fi
            if [ "$(stat -c%s "$file")" -ge 50000000 ]; then
              curl --fail --silent --show-error --retry 2 \
                -F "chat_id=$CHANNEL_ID" \
                -F "text=PlayTorrio PS4 v1.4.0 $label: $RELEASE_URL (attachment exceeds 50 MB)" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" >/dev/null
            else
              curl --fail --silent --show-error --retry 2 \
                -F "chat_id=$CHANNEL_ID" \
                -F "document=@$file" \
                -F "caption=PlayTorrio PS4 v1.4.0: $label. Native PS4 TMDB fetch enabled; Windows HostTools is an optional fallback. GitHub sync remains disabled. $RELEASE_URL" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" >/dev/null
            fi
            echo "Delivered $label to configured Telegram channel."
          done
          echo "Telegram delivery completed for ZIP and PKG." >> "$GITHUB_STEP_SUMMARY"
